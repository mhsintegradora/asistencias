<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030712">
<link rel="manifest" href="manifest.json">
<title>MHS Integradora</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #030712;
    color: #e6e8ec;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px;
  }
  .logo {
    width: 80px; height: 80px; border-radius: 22px;
    background: linear-gradient(145deg, #1e2745, #0f172a);
    border: 1px solid rgba(106,142,255,.25);
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; font-weight: 900; color: #6a8eff;
    box-shadow: 0 12px 32px rgba(106,142,255,.18);
  }
  h1 { margin: 4px 0 0; font-size: 18px; font-weight: 700; letter-spacing: .3px; }
  .sub { font-size: 12px; color: rgba(147,175,206,.7); margin-top: 2px; }
  .progress {
    width: 220px; height: 4px; background: rgba(255,255,255,.08);
    border-radius: 2px; overflow: hidden; margin-top: 24px;
  }
  .progress-bar {
    height: 100%; width: 30%; background: linear-gradient(90deg, #6a8eff, #3ddc84);
    border-radius: 2px; animation: slide 1.2s ease-in-out infinite;
  }
  @keyframes slide {
    0%   { transform: translateX(-100%); }
    50%  { transform: translateX(140%); }
    100% { transform: translateX(380%); }
  }
  .status { font-size: 11px; color: rgba(147,175,206,.6); margin-top: 10px; }
  .manual-links {
    margin-top: 40px;
    font-size: 12px;
    color: rgba(147,175,206,.45);
    text-align: center;
    display: none;
  }
  .manual-links a {
    color: #6a8eff; text-decoration: none;
    margin: 0 6px; padding: 6px 12px;
    border: 1px solid rgba(106,142,255,.3); border-radius: 6px;
    display: inline-block; margin-top: 6px;
  }
  .show-manual .manual-links { display: block; }
</style>
</head>
<body>
  <div class="logo">M</div>
  <h1>MHS Integradora</h1>
  <div class="sub">Sistema de Recursos Humanos</div>
  <div class="progress"><div class="progress-bar"></div></div>
  <div class="status" id="statusMsg">Detectando dispositivo...</div>

  <div class="manual-links">
    <div>¿No se redirige automáticamente?</div>
    <a href="mobile.html">📱 Versión móvil</a>
    <a href="desktop.html">💻 Versión desktop</a>
  </div>

<script>
(function () {
  var ua = navigator.userAgent || '';
  var isMobile =
    /Android|iPhone|iPad|iPod|Opera Mini|IEMobile|BlackBerry|Mobile/i.test(ua) ||
    (window.matchMedia && window.matchMedia('(max-width: 900px)').matches);

  var target = isMobile ? 'mobile.html' : 'desktop.html';
  var status = document.getElementById('statusMsg');

  // Permite override por query: ?force=mobile o ?force=desktop
  var qs = new URLSearchParams(window.location.search);
  if (qs.get('force') === 'mobile')  target = 'mobile.html';
  if (qs.get('force') === 'desktop') target = 'desktop.html';

  status.textContent = isMobile ? 'Cargando versión móvil...' : 'Cargando versión desktop...';

  // Si en 4s no redirigió, mostrar opciones manuales
  setTimeout(function () {
    document.body.classList.add('show-manual');
  }, 4000);

  // Redirige preservando hash y query (sin ?force)
  setTimeout(function () {
    var url = target;
    if (window.location.hash) url += window.location.hash;
    window.location.replace(url);
  }, 350);
})();
</script>
</body>
</html>
